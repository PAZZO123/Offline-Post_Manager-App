name: offline_posts_manager
description: A Flutter app to manage posts offline using SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0               # SQLite — built into Android
  path: ^1.9.0                  # database file path
  crypto: ^3.0.3                # SHA-256 password hashing
  shared_preferences: ^2.2.3    # persists login session across restarts
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true